{% extends 'base.html' %}
{% load wagtailimages_tags %}

{% block content %}
    <!-- Sub-page hero section with dynamic color and banner -->
    <section style="padding: 40px 20px; text-align: center; color: #ffffff;
        --bg: {% if page.banner_image %}{% image page.banner_image fill-1600x400 as bg_img %}linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('{{ bg_img.url }}'){% else %}{{ page.theme_color }}{% endif %};
        background: var(--bg) center/cover no-repeat;">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}
            <p style="margin-top: 10px; font-size: 1.1rem;">{{ page.subtitle }}</p>
        {% endif %}
    </section>

    <!-- Subpage content placeholder -->
    <div style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        <p>Ez az aloldal törzse. Ide fognak megérkezni a StreamField blokkok.</p>
    </div>
{% endblock %}
