{% load wagtailcore_tags %}

<!-- Responsive two-column layout rendering nested blocks in each column -->
<div style="max-width: 1100px; margin: 35px auto; padding: 0 20px;">
    <div style="{% if self.card_wrapper %}background: #ffffff; border-radius: 8px; padding: 32px; box-shadow: 0 3px 12px rgba(0,0,0,0.07);{% endif %} display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; align-items: start;">
        <div>
            {% for block in self.left_column %}
                {% include_block block %}
            {% endfor %}
        </div>
        <div>
            {% for block in self.right_column %}
                {% include_block block %}
            {% endfor %}
        </div>
    </div>
</div>
